version: 2

models:
  - name: stg_olist__customers
    description: Um cliente por linha, com cidade/estado normalizados (minúsculo/maiúsculo).
    columns:
      - name: customer_id
        description: Chave do cliente no nível do pedido (não é o unique_id do cliente físico).
        tests:
          - unique
          - not_null
  - name: stg_olist__products
    description: Um produto por linha, com nomes de coluna padronizados.
    columns:
      - name: product_id
        description: Chave de id do produto.
        tests:
          - unique
          - not_null

  - name: stg_olist__orders
    description: Um pedido por linha, com os timestamps do ciclo de vida do pedido.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_olist__customers')
              field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']

  - name: stg_olist__order_items
    description: Um item de pedido por linha.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - order_item_id
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_olist__orders')
              field: order_id
      - name: item_price
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: stg_olist__order_payments
    description: Uma forma de pagamento por linha (um pedido pode ter mais de uma).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - payment_sequential
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_type
        tests:
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: payment_value
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: stg_olist__sellers
    description: Um vendedor por linha.
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: stg_olist__order_reviews
    description: Uma avaliação por linha.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - review_id
            - order_id
    columns:
      - name: review_id
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: review_score
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              quote: false

  - name: stg_olist__geolocation
    description: Coordenadas por prefixo de CEP. Há várias linhas por CEP (não é chave única).
    columns:
      - name: geolocation_zip_code_prefix
        tests:
          - not_null
